CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_CAN=y
# RX overrun counter in the 1 s summary (ovr=)
CONFIG_STATS=y
CONFIG_CAN_STATS=y
# CONFIG_CAN_MCP2515 is turned on automatically by the mcp2515 nodes in app.overlay
CONFIG_PWM=y
CONFIG_ADC=y
# Independent watchdog (R4.5) and reset-cause readout
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=2048
