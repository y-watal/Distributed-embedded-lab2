CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_CAN=y
# CONFIG_CAN_MCP2515 is turned on automatically by the mcp2515 nodes in app.overlay
CONFIG_PWM=y
CONFIG_ADC=y
# Independent watchdog (R4.5) and reset-cause readout
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
# Quadrature encoder driver (st,stm32-qdec), as in Lab 2
CONFIG_SENSOR=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=2048
