CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_CAN=y
# RX overrun counter in the 1 s summary (ovr=)
CONFIG_STATS=y
CONFIG_CAN_STATS=y
# CONFIG_CAN_MCP2515 is turned on automatically by the mcp2515 nodes in app.overlay
CONFIG_PWM=y
CONFIG_ADC=y
# Independent watchdog (R4.5) and reset-cause readout
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
# Quadrature encoder driver (st,stm32-qdec), as in Lab 2
CONFIG_SENSOR=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=2048

# WCET measurement (src/wcet.c): per-thread CPU time, which stops while a
# thread is preempted or blocked. ANALYSIS adds the driver threads' longest run.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y
